<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pet Salon Manager Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f6f7;color:#222}
header{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:3}.logo{font-weight:800;font-size:20px}
.layout{display:flex;min-height:calc(100vh - 64px)}nav{width:220px;background:#fff;border-right:1px solid #ddd;padding:14px 10px}.nav{padding:12px;border-radius:9px;margin:3px 0;cursor:pointer}.nav:hover,.nav.active{background:#eef1f3}
main{flex:1;padding:22px;max-width:1300px;width:100%;margin:auto}.page{display:none}.page.active{display:block}h1{font-size:24px;margin:0 0 16px}h2{font-size:18px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:17px}.metric{font-size:27px;font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}button.primary{background:#222;color:#fff;border-color:#222}button.danger{background:#fff;border-color:#c66}
input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit}label{font-size:12px;color:#555;display:block;margin:8px 0 4px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#f4f5f6}
.split{display:grid;grid-template-columns:310px 1fr;gap:14px}.customer-list{max-height:560px;overflow:auto}.person{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.person:hover,.person.sel{background:#eef1f3}.muted{color:#777;font-size:12px}
.badge{display:inline-block;padding:4px 7px;border-radius:20px;background:#eee;font-size:11px;margin-right:4px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{height:130px;border:1px solid #ddd;border-radius:9px;overflow:hidden;background:#eee;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photo small{position:absolute;bottom:0;left:0;right:0;background:#0008;color:#fff;padding:4px}
.calendar{display:grid;grid-template-columns:60px repeat(7,1fr);background:#fff;border:1px solid #ddd}.calhead,.time,.slot{border-right:1px solid #eee;border-bottom:1px solid #eee;min-height:58px;padding:6px;font-size:11px}.calhead{text-align:center;font-weight:700;background:#f4f5f6}.event{background:#e7ecef;border-radius:7px;padding:5px;margin:2px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;z-index:8}.modal.show{display:flex}.dialog{background:#fff;border-radius:14px;padding:20px;width:min(600px,94vw);max-height:90vh;overflow:auto}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}
.kpi{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.timeline{border-left:2px solid #ddd;padding-left:14px}.timeline div{margin:0 0 14px}.notice{padding:10px;background:#f1f3f4;border-radius:9px;margin:8px 0}
@media(max-width:850px){nav{width:60px}.nav span{display:none}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.calendar{overflow:auto;min-width:760px}}
</style><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#222222"></head><body>
<header><div class="logo">🐾 Pet Salon Manager Pro</div><button class="primary" onclick="openBooking()">＋ 新規予約</button></header>
<div class="layout"><nav>
<div class="nav active" onclick="show('dash',this)">🏠 <span>ホーム</span></div>
<div class="nav" onclick="show('customers',this)">👤 <span>顧客・カルテ</span></div>
<div class="nav" onclick="show('calendar',this)">📅 <span>予約カレンダー</span></div>
<div class="nav" onclick="show('checkout',this)">🧾 <span>会計</span></div>
<div class="nav" onclick="show('sales',this)">💰 <span>売上管理</span></div>
</nav><main>

<section id="dash" class="page active"><h1>ホーム</h1><div class="grid">
<div class="card">今日の予約<div class="metric" id="kBookings">4件</div></div><div class="card">今日の売上<div class="metric" id="kSales">¥28,600</div></div>
<div class="card">今月の売上<div class="metric" id="kMonth">¥386,400</div></div><div class="card">未会計<div class="metric" id="kUnpaid">0件</div></div></div><br>
<div class="card"><h2>本日の予約</h2><table id="today"></table></div></section>

<section id="customers" class="page"><h1>顧客・ペットカルテ</h1><div class="split">
<div class="card"><div class="toolbar"><button class="primary" onclick="openCustomer()">＋ 顧客登録</button></div><input id="search" placeholder="飼い主・ペット検索" oninput="renderCustomers()"><div class="customer-list" id="customerList"></div></div>
<div id="profile" class="card"><div class="muted">左から顧客を選択してください。</div></div></div></section>

<section id="calendar" class="page"><h1>予約カレンダー</h1><div class="toolbar"><button onclick="shift(-1)">‹</button><button onclick="shift(1)">›</button><button onclick="goToday()">今日</button><span id="weekLabel"></span></div><div class="calendar" id="cal"></div></section>

<section id="checkout" class="page"><h1>会計</h1><div class="card"><table id="checkoutTable"></table></div></section>
<section id="sales" class="page"><h1>売上管理</h1><div class="grid"><div class="card">今日<div class="metric" id="sToday">¥0</div></div><div class="card">今週<div class="metric" id="sWeek">¥0</div></div><div class="card">今月<div class="metric" id="sMonth">¥0</div></div><div class="card">平均客単価<div class="metric" id="sAvg">¥0</div></div></div><br><div class="card"><h2>会計履歴</h2><table id="salesTable"></table></div></section>
</main></div>

<div class="modal" id="customerModal"><div class="dialog"><h2>顧客登録</h2><div class="row"><div><label>飼い主名</label><input id="cName"></div><div><label>電話番号</label><input id="cPhone"></div></div><div class="row"><div><label>ペット名</label><input id="cPet"></div><div><label>種類</label><select id="cType"><option>犬</option><option>猫</option><option>その他</option></select></div></div><div class="row"><div><label>犬種・猫種</label><input id="cBreed"></div><div><label>誕生日</label><input id="cBirth" type="date"></div></div><label>カルテ・注意事項</label><textarea id="cMemo" rows="4"></textarea><div class="actions"><button onclick="closeM('customerModal')">閉じる</button><button class="primary" onclick="saveCustomer()">登録</button></div></div></div>

<div class="modal" id="bookingModal"><div class="dialog"><h2>予約登録</h2><div class="row"><div><label>顧客</label><select id="bCustomer" onchange="syncPet()"></select></div><div><label>ペット</label><input id="bPet"></div></div><div class="row"><div><label>日付</label><input id="bDate" type="date"></div><div><label>時間</label><input id="bTime" type="time" value="10:00"></div></div><div class="row"><div><label>メニュー</label><select id="bMenu" onchange="priceByMenu()"><option>トリミング</option><option>シャンプー</option><option>グルーミング</option><option>爪切り</option><option>その他</option></select></div><div><label>料金</label><input id="bPrice" type="number" value="8800"></div></div><label>メモ</label><textarea id="bMemo" rows="3"></textarea><div class="actions"><button onclick="closeM('bookingModal')">閉じる</button><button class="primary" onclick="saveBooking()">予約登録</button></div></div></div>

<div class="modal" id="editModal"><div class="dialog"><h2>予約詳細・変更</h2><div id="editBody"></div></div></div>
<div class="modal" id="payModal"><div class="dialog"><h2>会計</h2><div id="payBody"></div></div></div>

<script>
const key='ps_pro_v2';
let data=JSON.parse(localStorage.getItem(key)||'null')||{
customers:[
{id:1,name:'山田 花子',phone:'090-1234-5678',pet:'ポチ',type:'犬',breed:'トイプードル',birth:'2020-04-10',memo:'皮膚が少し敏感。顔周りは短め。',photos:[]},
{id:2,name:'佐藤 太郎',phone:'080-2345-6789',pet:'ミミ',type:'猫',breed:'スコティッシュフォールド',birth:'2019-08-21',memo:'爪切りは苦手。',photos:[]},
{id:3,name:'鈴木 一郎',phone:'070-3456-7890',pet:'ココ',type:'犬',breed:'柴犬',birth:'2018-02-02',memo:'シャンプー後にしっかり乾燥。',photos:[]},
{id:4,name:'田中 美咲',phone:'090-4567-8901',pet:'モモ',type:'犬',breed:'チワワ',birth:'2021-11-11',memo:'',photos:[]}
],
bookings:[
{id:1,date:new Date().toISOString().slice(0,10),time:'09:00',customerId:1,pet:'ポチ',menu:'トリミング',price:8800,status:'予約',paid:false,memo:''},
{id:2,date:new Date().toISOString().slice(0,10),time:'10:30',customerId:2,pet:'ミミ',menu:'シャンプー',price:6600,status:'予約',paid:false,memo:''},
{id:3,date:new Date().toISOString().slice(0,10),time:'13:00',customerId:3,pet:'ココ',menu:'トリミング',price:9900,status:'予約',paid:false,memo:''},
{id:4,date:new Date().toISOString().slice(0,10),time:'15:00',customerId:4,pet:'モモ',menu:'爪切り',price:3300,status:'予約',paid:false,memo:''}
],payments:[],history:[]};
let selectedId=1, viewDate=new Date();
function persist(){localStorage.setItem(key,JSON.stringify(data));refresh()}
function cust(id){return data.customers.find(x=>x.id==id)}
function yen(n){return '¥'+Number(n||0).toLocaleString()}
function todayStr(){return new Date().toISOString().slice(0,10)}
function show(id,el){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el.classList.add('active');refresh()}
function refresh(){renderToday();renderCustomers();renderCal();renderCheckout();renderSales();metrics()}
function openCustomer(){document.getElementById('customerModal').classList.add('show')}
function closeM(id){document.getElementById(id).classList.remove('show')}
function saveCustomer(){if(!cName.value||!cPet.value)return alert('飼い主名とペット名を入力してください');data.customers.push({id:Date.now(),name:cName.value,phone:cPhone.value,pet:cPet.value,type:cType.value,breed:cBreed.value,birth:cBirth.value,memo:cMemo.value,photos:[]});closeM('customerModal');persist();selectCustomer(data.customers.at(-1).id)}
function renderCustomers(){let q=(search?.value||'').toLowerCase();customerList.innerHTML=data.customers.filter(c=>(c.name+c.pet+c.breed).toLowerCase().includes(q)).map(c=>`<div class="person ${selectedId==c.id?'sel':''}" onclick="selectCustomer(${c.id})"><b>${c.name}</b><br>🐾 ${c.pet} <span class="muted">${c.breed}</span></div>`).join('')}
function selectCustomer(id){selectedId=id;renderCustomers();let c=cust(id), visits=data.bookings.filter(b=>b.customerId==id&&!['キャンセル'].includes(b.status)).sort((a,b)=>b.date.localeCompare(a.date));profile.innerHTML=`<h2>${c.name}　🐾 ${c.pet}</h2><div class="muted">${c.type} / ${c.breed} / ${c.birth||'誕生日未登録'}</div><div class="notice">📞 ${c.phone||'-'}<br>⚠️ ${c.memo||'注意事項なし'}</div><div class="toolbar"><button class="primary" onclick="bookFor(${c.id})">＋ このペットを予約</button><button onclick="addPhoto()">📷 施術写真を追加</button></div><h2>施術写真</h2><div class="photo-grid">${(c.photos||[]).map(x=>`<div class="photo"><img src="${x.url}"><small>${x.date}</small></div>`).join('')||'<div class="muted">まだ写真がありません</div>'}</div><br><h2>来店・施術履歴</h2><div class="timeline">${visits.map(b=>`<div><b>${b.date}</b>　${b.menu} ${yen(b.price)}　${b.paid?'✓ 会計済':'○ 未会計'}<br><span class="muted">${b.memo||''}</span></div>`).join('')||'<div class="muted">履歴なし</div>'}</div>`}
function addPhoto(){let c=cust(selectedId);let url=prompt('写真URLを入力してください（例：https://...）');if(!url)return;c.photos=c.photos||[];c.photos.push({url,date:todayStr()});persist();selectCustomer(c.id)}
function openBooking(){bCustomer.innerHTML=data.customers.map(c=>`<option value="${c.id}">${c.name} / ${c.pet}</option>`).join('');bDate.value=todayStr();syncPet();document.getElementById('bookingModal').classList.add('show')}
function bookFor(id){openBooking();bCustomer.value=id;syncPet()}
function syncPet(){let c=cust(bCustomer.value);if(c)bPet.value=c.pet}
function priceByMenu(){bPrice.value={トリミング:8800,シャンプー:6600,グルーミング:7700,爪切り:3300,その他:5000}[bMenu.value]||5000}
function saveBooking(){let b={id:Date.now(),date:bDate.value,time:bTime.value,customerId:+bCustomer.value,pet:bPet.value,menu:bMenu.value,price:+bPrice.value,status:'予約',paid:false,memo:bMemo.value};data.bookings.push(b);closeM('bookingModal');persist();alert('予約を登録しました')}
function renderToday(){let arr=data.bookings.filter(b=>b.date===todayStr()&&b.status!=='キャンセル').sort((a,b)=>a.time.localeCompare(b.time));today.innerHTML='<tr><th>時間</th><th>顧客</th><th>ペット</th><th>メニュー</th><th>料金</th><th>状態</th><th>操作</th></tr>'+arr.map(b=>`<tr><td>${b.time}</td><td>${cust(b.customerId)?.name}</td><td>${b.pet}</td><td>${b.menu}</td><td>${yen(b.price)}</td><td>${b.paid?'会計済':'未会計'}</td><td><button onclick="editBooking(${b.id})">詳細</button> <button onclick="pay(${b.id})">会計</button></td></tr>`).join('')}
function editBooking(id){let b=data.bookings.find(x=>x.id==id);editBody.innerHTML=`<label>日付</label><input id="eDate" type="date" value="${b.date}"><label>時間</label><input id="eTime" type="time" value="${b.time}"><label>メニュー</label><select id="eMenu"><option ${b.menu==='トリミング'?'selected':''}>トリミング</option><option ${b.menu==='シャンプー'?'selected':''}>シャンプー</option><option ${b.menu==='グルーミング'?'selected':''}>グルーミング</option><option ${b.menu==='爪切り'?'selected':''}>爪切り</option><option>その他</option></select><label>料金</label><input id="ePrice" type="number" value="${b.price}"><label>メモ</label><textarea id="eMemo" rows="3">${b.memo||''}</textarea><div class="actions"><button onclick="closeM('editModal')">閉じる</button><button onclick="cancel(${b.id})">キャンセル</button><button class="primary" onclick="saveEdit(${b.id})">変更保存</button></div>`;document.getElementById('editModal').classList.add('show')}
function saveEdit(id){let b=data.bookings.find(x=>x.id==id);Object.assign(b,{date:eDate.value,time:eTime.value,menu:eMenu.value,price:+ePrice.value,memo:eMemo.value});closeM('editModal');persist()}
function cancel(id){let b=data.bookings.find(x=>x.id==id);if(confirm('この予約をキャンセルしますか？')){b.status='キャンセル';persist();closeM('editModal')}}
function pay(id){let b=data.bookings.find(x=>x.id==id),c=cust(b.customerId);payBody.innerHTML=`<div class="kpi"><span>顧客</span><b>${c.name} / ${b.pet}</b></div><div class="kpi"><span>メニュー</span><b>${b.menu}</b></div><div class="kpi"><span>施術料金</span><b>${yen(b.price)}</b></div><label>追加料金</label><input id="pExtra" type="number" value="0"><label>割引</label><input id="pDiscount" type="number" value="0"><label>支払方法</label><select id="pMethod"><option>現金</option><option>クレジットカード</option><option>電子マネー</option><option>その他</option></select><div class="notice">合計：<b id="pTotal">${yen(b.price)}</b></div><div class="actions"><button onclick="closeM('payModal')">閉じる</button><button class="primary" onclick="completePay(${id})">会計を確定</button></div>`;pExtra.oninput=pDiscount.oninput=()=>pTotal.textContent=yen(b.price+(+pExtra.value||0)-(+pDiscount.value||0));document.getElementById('payModal').classList.add('show')}
function completePay(id){let b=data.bookings.find(x=>x.id==id),total=b.price+(+pExtra.value||0)-(+pDiscount.value||0);b.paid=true;b.status='完了';data.payments.push({id:Date.now(),bookingId:id,date:todayStr(),amount:total,method:pMethod.value});data.history.push({date:todayStr(),type:'会計',bookingId:id,amount:total});closeM('payModal');persist();alert('会計を確定しました。売上へ自動反映しました。')}
function renderCheckout(){let arr=data.bookings.filter(b=>b.status!=='キャンセル'&&!b.paid).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));checkoutTable.innerHTML='<tr><th>日付</th><th>時間</th><th>顧客</th><th>ペット</th><th>メニュー</th><th>金額</th><th></th></tr>'+arr.map(b=>`<tr><td>${b.date}</td><td>${b.time}</td><td>${cust(b.customerId)?.name}</td><td>${b.pet}</td><td>${b.menu}</td><td>${yen(b.price)}</td><td><button class="primary" onclick="pay(${b.id})">会計</button></td></tr>`).join('')||'<tr><td colspan="7">未会計の予約はありません。</td></tr>'}
function renderSales(){let ps=data.payments,ts=todayStr(),now=new Date(),week=new Date();week.setDate(now.getDate()-6);let w=week.toISOString().slice(0,10),month=ts.slice(0,7);let sum=a=>a.reduce((s,x)=>s+x.amount,0);sToday.textContent=yen(sum(ps.filter(x=>x.date===ts)));sWeek.textContent=yen(sum(ps.filter(x=>x.date>=w)));sMonth.textContent=yen(sum(ps.filter(x=>x.date.startsWith(month))));sAvg.textContent=yen(ps.length?Math.round(sum(ps)/ps.length):0);salesTable.innerHTML='<tr><th>日付</th><th>顧客</th><th>メニュー</th><th>支払方法</th><th>売上</th></tr>'+ps.slice().reverse().map(p=>{let b=data.bookings.find(x=>x.id==p.bookingId);return `<tr><td>${p.date}</td><td>${cust(b?.customerId)?.name||'-'}</td><td>${b?.menu||'-'}</td><td>${p.method}</td><td>${yen(p.amount)}</td></tr>`}).join('')||'<tr><td colspan="5">会計履歴はありません。</td></tr>'}
function metrics(){let t=todayStr(),arr=data.bookings.filter(b=>b.date===t&&b.status!=='キャンセル'),ps=data.payments; kBookings.textContent=arr.length+'件';kSales.textContent=yen(ps.filter(x=>x.date===t).reduce((s,x)=>s+x.amount,0));kUnpaid.textContent=data.bookings.filter(b=>b.date===t&&b.status!=='キャンセル'&&!b.paid).length+'件';kMonth.textContent=yen(ps.filter(x=>x.date.startsWith(t.slice(0,7))).reduce((s,x)=>s+x.amount,0))}
function startWeek(d){let x=new Date(d),n=x.getDay();x.setDate(x.getDate()-(n===0?6:n-1));x.setHours(0,0,0,0);return x}
function renderCal(){let s=startWeek(viewDate),days=[];for(let i=0;i<7;i++){let d=new Date(s);d.setDate(s.getDate()+i);days.push(d)}weekLabel.textContent=days[0].toLocaleDateString('ja-JP',{month:'long',day:'numeric'})+'〜'+days[6].toLocaleDateString('ja-JP',{month:'long',day:'numeric'});let h='<div class="calhead">時間</div>'+days.map(d=>`<div class="calhead">${d.toLocaleDateString('ja-JP',{weekday:'short',month:'numeric',day:'numeric'})}</div>`).join('');for(let hr=9;hr<=18;hr++){h+=`<div class="time">${String(hr).padStart(2,'0')}:00</div>`;for(let d of days){let ds=d.toISOString().slice(0,10),ev=data.bookings.filter(b=>b.date===ds&&parseInt(b.time)===hr&&b.status!=='キャンセル');h+=`<div class="slot">${ev.map(b=>`<div class="event" onclick="editBooking(${b.id})">${b.time} ${b.pet}<br>${b.menu}${b.paid?' ✓':''}</div>`).join('')}</div>`}}cal.innerHTML=h}
function shift(n){viewDate.setDate(viewDate.getDate()+n*7);renderCal()}function goToday(){viewDate=new Date();renderCal()}
refresh();
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./service-worker.js").catch(()=>{});}</script></body></html>
